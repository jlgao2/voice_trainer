[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-trainer"
version = "0.1.0"
description = "A CLI tool for voice training practice"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Voice Trainer"}
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "praat-parselmouth>=0.4.3",
    "scipy>=1.10.0",
]

[project.scripts]
voice = "voice_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_trainer*"]
